# Perfil usado no container. Tudo vem de variavel de ambiente,
# porque application.properties e gitignored e nao vai para a imagem.
spring.application.name=FD SmartCheck
server.port=${SERVER_PORT:8080}

# Banco
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# JWT (expiracao em MILISSEGUNDOS — 36000000 = 10 horas)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}

# Upload (importacao de alunos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.time-zone=${APP_TIMEZONE:America/Sao_Paulo}

# Geolocalizacao do check-in
app.geo.secret-key=${APP_GEO_SECRET_KEY}
app.geo.max-time-diff-seconds=${APP_GEO_MAX_TIME_DIFF_SECONDS:60}
app.geo.default-radius-meters=${APP_GEO_DEFAULT_RADIUS_METERS:100}

# Origens do front liberadas no CORS (separadas por virgula)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Admin inicial — criado so quando nao existe nenhum ADMIN no banco.
# Sem APP_ADMIN_PASSWORD, uma senha aleatoria e gerada e sai no log da primeira subida.
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.name=${APP_ADMIN_NAME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:admin@fdsmartcheck.local}
app.admin.password=${APP_ADMIN_PASSWORD:}

logging.level.org.fdsmartcheck=INFO
logging.level.org.springframework.security=WARN
