services:
  db:
    image: postgres:16-alpine
    container_name: fdsmartcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fdsmartcheck}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Porta NAO exposta de proposito: o banco so precisa ser alcancado pela api,
    # pela rede interna do compose. Para depurar, descomente:
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fdsmartcheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fdsmartcheck-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fdsmartcheck}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-36000000}
      APP_GEO_SECRET_KEY: ${APP_GEO_SECRET_KEY:?defina APP_GEO_SECRET_KEY no .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Administrador}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@fdsmartcheck.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
